<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6A11CB, #FC4A1A);
    padding: 32px 16px;
}

.wrapper {
    max-width: 600px;
    margin: auto;
    background: rgba(31,41,51,0.85);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
}

h1 {
    color: white;
    text-align: center;
    margin-bottom: 20px;
}

input, textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(17,17,17,0.85);
    color: white;
}

textarea {
    resize: none;
    height: 120px;
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-weight: bold;
    background: #FC4A1A;
    color: white;
    cursor: pointer;
    transition: all 0.25s ease;
}

button:hover {
    background: #FF6A3D;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(252,74,26,0.45);
}

.success {
    color: #22C55E;
    text-align: center;
    margin-bottom: 15px;
}

/* BACK BUTTON */
.back-btn {
    display: inline-block;
    margin-bottom: 18px;
    padding: 10px 18px;
    border-radius: 12px;
    background: #FC4A1A;
    color: white;
    font-weight: bold;
    text-decoration: none;
    transition: all 0.25s ease;
}

.back-btn:hover {
    background: #FF6A3D;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(252,74,26,0.45);
}
</style>
</head>

<body>

<div class="wrapper">
    <a href="{% url 'home' %}" class="back-btn">← Back</a>

<h1>Contact Us</h1>

{% if user.is_authenticated %}
    <p style="text-align:center; color:#22C55E; margin-bottom:18px;">
        Welcome, {{ user.username }}
    </p>
{% endif %}

{% if messages %}
    {% for message in messages %}
        <div class="success">{{ message }}</div>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <textarea name="message" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
</form>

</div>

</body>
</html>
