<!DOCTYPE html>
<html>
<head>
    <title>Todo Lists</title>
    <style>
        body {
            background: #ffe6cc;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .add-box {
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .list-card {
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-card a {
            text-decoration: none;
            font-size: 18px;
            color: #000;
            font-weight: bold;
        }

        input {
            padding: 5px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Add Todo List</h2>

<div class="add-box">
    <form method="post">
        {% csrf_token %}
        <input type="text" name="list_name" placeholder="Todo list name" required>
        <button>Add</button>
    </form>
</div>

{% for list in lists %}
<div class="list-card">
    <a href="{% url 'todo-detail' list.id %}">
        {{ list.name }}
    </a>

    <form method="post">
        {% csrf_token %}
        <button name="delete_list" value="{{ list.id }}">Delete</button>
    </form>
</div>
{% empty %}
<p>No todo lists created yet.</p>
{% endfor %}

</body>
</html>
